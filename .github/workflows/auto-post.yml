name: YouTube Shorts to Facebook (Link Only)

permissions:
  contents: write

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🔥 مهم: نجيب آخر نسخة من repo
      - name: Pull latest changes
        run: git pull origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests isodate

      - name: Run script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          FB_PAGE_ID: ${{ secrets.PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python script.py

      # 🔥 حفظ آخر فيديو بدون حذف التاريخ
      - name: Commit last video file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add last_video.txt

          git commit -m "Update last video" || echo "No changes"

          git pull --rebase origin main

          git push          git config user.email "github-actions@github.com"
          git add last_video.txt
          git commit -m "Update last video" || echo "No changes"
          git push
